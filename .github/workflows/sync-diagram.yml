name: Sync dbdiagram

on:
  push:
    branches: [main]
    paths:
      - 'docs/db_schema.dbml'
      - '.dbdiagram/settings.json'

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DBDIAGRAM_TOKEN: ${{ secrets.DBDIAGRAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g dbdiagram
      - run: dbdiagram push
      - run: dbdiagram build document
